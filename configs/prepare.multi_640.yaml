base_dir: data/processed

inputs:
  matched_buildings_file: data/interim/matched_buildings.parquet

outputs:
  all_jsonl: all.jsonl
  train_jsonl: train.jsonl
  val_jsonl: val.jsonl
  test_jsonl: test.jsonl
  summary_file: summary.json

records:
  max_records: null
  shuffle: true
  seed: 42

crops:
  - name: fixed_640
    mode: fixed
    fixed_size_px: 640
    square: true
    drop_edge_crops: true

  - name: adaptive_640
    mode: adaptive
    padding_ratio: 0.5
    min_padding_px: 50
    adaptive_scale: 2.0
    min_size_px: 100
    max_size_px: 640
    square: true
    drop_edge_crops: true

crop_images:
  enabled: true
  output_dir: crops
  image_format: png
  overwrite: false
  relative_to: .

split:
  enabled: true
  group_key: image
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 42
