eubucco:
  input_dir: data/raw/eubucco
  file_glob: "**/*.parquet"
  dissolve_by_id: false
  require_construction_year: true
  min_area_m2: 20
  max_area_m2: null

tiles:
  input_dir: data/raw/bayern/dop20
  file_glob: "**/*.tif"

match:
  strategy: centroid_within_tile
  keep_unmatched: false
  target_crs: null

outputs:
  cleaned_buildings_file: data/interim/clean_buildings.parquet
  tile_index_file: data/interim/tile_index.parquet
  matched_buildings_file: data/interim/matched_buildings.parquet
