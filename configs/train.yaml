task: building_decade

model:
  model_id: google/paligemma2-3b-pt-448
  torch_dtype: bfloat16
  device_map: auto

base_dir: /path/to

data:
  train_jsonl: train.jsonl
  val_jsonl: val.jsonl
  test_jsonl: test.jsonl
  image_root: .
  max_records: null

generation:
  max_new_tokens: 32
  do_sample: false
  temperature: null
  top_p: null
  num_beams: 1

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: /path/to/output
  num_train_epochs: 5
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  logging_steps: 20
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
  bf16: true
  fp16: false
  gradient_checkpointing: true
  remove_unused_columns: false
  report_to: []
  seed: 42
