inputs:
  matched_buildings_file: data/interim/matched_buildings.parquet

outputs:
  all_jsonl: data/processed/single_building/all.jsonl
  train_jsonl: data/processed/single_building/train.jsonl
  val_jsonl: data/processed/single_building/val.jsonl
  test_jsonl: data/processed/single_building/test.jsonl
  summary_file: data/processed/single_building/summary.json

records:
  max_records: null
  shuffle: true
  seed: 42

crop:
  mode: percent

  # Used by mode="percent" and mode="adaptive"
  padding_ratio: 0.5
  min_padding_px: 25 # 5 meters
  max_padding_px: null

  # Used by mode="fixed"
  fixed_size_px: null

  # Used by mode="adaptive"
  adaptive_scale: 2.25
  min_size_px: 320 # 64 meters
  max_size_px: 800 # 160 meters

  square: true
  drop_edge_crops: true

split:
  enabled: true
  group_key: image
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 42
