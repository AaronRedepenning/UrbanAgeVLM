    - DE22 # Niederbayern
    - DE23 # Oberpfalz
    - DE24 # Oberfranken
    - DE25 # Mittelfranken
    - DE26 # Unterfranken
    - DE27 # Schwaben
    - DE30 # Berlin

bayern:
  enabled: true
  out_dir: data/raw/bayern/dop20
  meta4_urls:
    - https://geodaten.bayern.de/odd/a/dop20/meta/metalink/09162000.meta4 # München
    - https://geodaten.bayern.de/odd/a/dop20/meta/metalink/09163000.meta4 # Rosenheim
    - https://geodaten.bayern.de/odd/a/dop20/meta/metalink/09562000.meta4 # Erlangen
    - https://geodaten.bayern.de/odd/a/dop20/meta/metalink/09775129.meta4 # Illertissen
    - https://geodaten.bayern.de/odd/a/dop20/meta/metalink/09775135.meta4 # Neu-Ulm

download:
