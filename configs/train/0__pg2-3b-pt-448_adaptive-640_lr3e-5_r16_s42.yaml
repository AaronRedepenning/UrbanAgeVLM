task: building_class

model:
  model_id: google/paligemma2-3b-pt-448
  adapter_id: null
  processor_id: null
  torch_dtype: bfloat16
  device_map: auto

base_dir: /content/datasets/adaptive_640

data:
  train_jsonl: train.jsonl
  val_jsonl: val.jsonl
  test_jsonl: test.jsonl
  predict_jsonl: null
  image_root: .
  max_records: null

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    # - gate_proj
    # - up_proj
    # - down_proj

training:
  output_dir: /content/drive/MyDrive/models/0__pg2-3b-pt-448_adaptive-640_lr3e-5_r16_s42
  num_train_epochs: 5
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 3e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  logging_steps: 20
  save_steps: 100
  eval_steps: 100
  save_total_limit: 20
  bf16: true
  fp16: false
  gradient_checkpointing: false
  remove_unused_columns: false
  report_to: ["wandb"]
  seed: 42
