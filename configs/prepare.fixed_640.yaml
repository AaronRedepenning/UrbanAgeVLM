inputs:
  matched_buildings_file: data/interim/matched_buildings.parquet

outputs:
  all_jsonl: data/processed/fixed_640/all.jsonl
  train_jsonl: data/processed/fixed_640/train.jsonl
  val_jsonl: data/processed/fixed_640/val.jsonl
  test_jsonl: data/processed/fixed_640/test.jsonl
  summary_file: data/processed/fixed_640/summary.json

records:
  max_records: null
  shuffle: true
  seed: 42

crop:
  mode: fixed

  # Used by mode="percent" and mode="adaptive"
  padding_ratio: 0.5
  min_padding_px: 50 # 10 meters
  max_padding_px: null

  # Used by mode="fixed"
  fixed_size_px: 640 # 128 meters

  # Used by mode="adaptive"
  adaptive_scale: 2.0
  min_size_px: 100 # 20 meters
  max_size_px: 640 # 128 meters

  square: true
  drop_edge_crops: true

crop_images:
  enabled: true
  output_dir: data/processed/fixed_640/crops
  image_format: png
  overwrite: false
  relative_to: data/processed/fixed_640

split:
  enabled: true
  group_key: image
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 42
