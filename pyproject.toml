[project]
name = "urban-vlm"
version = "0.1.0"
description = "PaliGemma fine tuning for building age prediction"
readme = "README.md"
authors = [
    { name = "Aaron Redepenning", email = "aaronredepenning@live.com" }
]
requires-python = ">=3.12"

# Keep this small: only things needed by the package/CLI/config code
dependencies = [
    "pillow>=10.4,<12",
    "pydantic>=2.8,<2.13",
    "pyyaml>=6.0.1",
    "requests>=2.31",
    "rich>=13,<14",
    "typer>=0.12",
]

[project.optional-dependencies]

# Tabular manifests, labels, parquet/arrow data.
data = [
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
]

# Heavy geospatial/data-prep stack.
# Use this for DOP20 tiling, vector joins, raster cropping, map prep, etc.
geo = [
    "geopandas>=1.1.3",
    "pyogrio>=0.12.1",
    "pyproj>=3.7.2",
    "rasterio>=1.5.0",
    "shapely>=2.1.2",
]

# Visualization / notebook map exploration.
viz = [
    "contextily>=1.7.0",
    "folium>=0.20.0",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.9",
    "xyzservices>=2026.3.0",
]

# Training on pre-generated image crops + labels/manifest.
train = [
    "accelerate>=1.0",
    "huggingface-hub>=0.25",
    "pandas>=2.2,<3",
    "peft>=0.13",
    "pyarrow>=16",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.50",
]

# Inference with a fine-tuned / adapter model.
# Keep peft here if you load LoRA adapters directly.
infer = [
    "accelerate>=1.14.0",
    "huggingface-hub>=1.16.1",
    "pandas>=3.0.3",
    "peft>=0.19.1",
    "pyarrow>=24.0.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "transformers>=5.12.0",
]

# Optional quantized training/inference.
# Keep separate because bitsandbytes is hardware/CUDA-sensitive.
quant = [
    "bitsandbytes>=0.45; platform_system == 'Linux'",
]

colab = [
    "accelerate>=1.0",
    "huggingface-hub>=0.25",
    "pandas>=2.2,<3",
    "peft>=0.13",
    "pyarrow>=16",
    "transformers>=4.50",
]

[dependency-groups]

# Local notebook environment.
notebook = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.5.8",
]

# Local development tools.
dev = [
    { include-group = "notebook" },
    "ruff>=0.15.16",
    "ty>=0.0.46",
]

[tool.uv]
# Prevent uv from installing dev by default in cloud runtimes.
# Locally, use: uv sync --group dev
default-groups = []

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
