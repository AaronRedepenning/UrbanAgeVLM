[project]
name = "urban-vlm"
version = "0.1.0"
description = "PaliGemma fine tuning for building age prediction"
readme = "README.md"
authors = [
    { name = "Aaron Redepenning", email = "aaronredepenning@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.3",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "shapely>=2.1.2",
]

[project.scripts]
urban-vlm = "urban_vlm:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.46",
]
